<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Royal Ludo</title>
<meta name="description" content="Royal Ludo – classic Ludo board game. Play vs computer or with friends. Install it on your phone!">
<meta name="theme-color" content="#070D1E">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Royal Ludo">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <section id="s-home" class="screen"></section>
  <section id="s-setup" class="screen"></section>
  <section id="s-game" class="screen"></section>
  <section id="s-howto" class="screen"></section>
  <section id="s-profile" class="screen"></section>
  <section id="s-settings" class="screen"></section>
  <section id="s-online" class="screen"></section>
</div>
<canvas id="confetti"></canvas>
<div id="toast" role="status"></div>
<noscript>Royal Ludo needs JavaScript enabled.</noscript>
<script src="config.js"></script>
<script src="engine.js"></script>
<script src="app.js"></script>
  <!-- এন্ট্রি ফি সিলেকশন মোডাল বা বক্স -->
<div id="entryFeeModal" style="display:none; position:fixed; top:50%; left:50%; transform:translate(-50%, -50%); background:#222; padding:20px; border-radius:10px; color:#fff; z-index:1000; text-align:center;">
    <h3>ম্যাচ ফি নির্বাচন করুন</h3>
    <p>অনলাইনে খেলতে এন্ট্রি ফি জমা দিন:</p>
    <button onclick="selectFee(50)" style="padding:10px 20px; margin:5px; background:green; color:white; border:none; border-radius:5px;">৫০ টাকা</button>
    <button onclick="selectFee(100)" style="padding:10px 20px; margin:5px; background:green; color:white; border:none; border-radius:5px;">১০০ টাকা</button>
    <br><br>
    <button onclick="closeFeeModal()" style="padding:5px 10px; background:red; color:white; border:none; border-radius:5px;">বন্ধ করুন</button>
</div>
<!-- ডিপোজিট ও উইথড্র বাটন সেকশন -->
<div style="text-align: center; margin: 15px;">
    <button onclick="openDepositModal()" style="padding: 8px 15px; background: #ff9800; color: white; border: none; border-radius: 5px; font-weight: bold; margin-right: 5px;">ডিপোজিট (Deposit)</button>
    <button onclick="openWithdrawModal()" style="padding: 8px 15px; background: #e91e63; color: white; border: none; border-radius: 5px; font-weight: bold;">উইথড্র (Withdraw)</button>
</div>

<!-- ডিপোজিট পপ-আপ বক্স -->
<div id="depositModal" style="display:none; position:fixed; top:50%; left:50%; transform:translate(-50%, -50%); background:#222; padding:20px; border-radius:10px; color:#fff; z-index:1000; text-align:center; width: 80%;">
    <h3>টাকা ডিপোজিট করুন</h3>
    <p>বিকাশ/নগদ সেন্ড মানি করে তথ্য দিন:</p>
    <input type="text" id="depNumber" placeholder="আপনার বিকাশ/নগদ নম্বর" style="padding:8px; width:90%; margin-bottom:10px;"><br>
    <input type="number" id="depAmount" placeholder="টাকার পরিমাণ (যেমন: ৫০০)" style="padding:8px; width:90%; margin-bottom:10px;"><br>
    <button onclick="submitDeposit()" style="padding:10px 20px; background:green; color:white; border:none; border-radius:5px;">রিকুয়েস্ট পাঠান</button>
    <button onclick="closeDepositModal()" style="padding:10px 20px; background:red; color:white; border:none; border-radius:5px; margin-left:5px;">বন্ধ করুন</button>
</div>

</body>
</html>
